name: Proxima Windows wallet
on:
  push:
    branches: [genspark_ai_developer]
    paths: ['proxima-wallet/**', '.github/workflows/proxima-windows.yml']
  pull_request:
    paths: ['proxima-wallet/**', '.github/workflows/proxima-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxima-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proxima-wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proxima-wallet/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - run: npm ci
      - run: npm run native:win
      - run: npm test
      - run: npm run test:desktop
      - run: npm run pack:win
      - run: npm run installer:win
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.exe' } | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Proxima-Wallet-Windows-x64
          path: |
            proxima-wallet/dist/*.zip
            proxima-wallet/dist/*.exe
            proxima-wallet/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
